###############################################################
#                   Authelia configuration                    #
###############################################################

server:
  address: 'tcp://:9091'

log:
  level: 'info'

totp:
  issuer: 'authelia.com'

identity_validation:
  reset_password:
    # jwt_secret: REMOVED and handled by the environment variable AUTHELIA_JWT_SECRET_FILE

authentication_backend:
  file:
    path: '/config/users_database.yml'

access_control:
  default_policy: 'deny'
  rules: [] # REMOVED and handled by the environment variables

session:
  name: 'authelia_session'
  # secret: REMOVED and handled by the environment variable AUTHELIA_SESSION_SECRET_FILE
  cookies:
      # domain: REMOVED and handled by the environment variable AUTHELIA_SESSION_COOKIES_0_DOMAIN
      # authelia_url: REMOVED and handled by the environment variable AUTHELIA_SESSION_COOKIES_0_AUTHELIA_URL
      # default_redirection_url: REMOVED and handled by the environment variable AUTHELIA_SESSION_COOKIES_0_DEFAULT_REDIRECTION_URL
      expiration: '1 hour'
      inactivity: '5 minutes'

regulation:
  modes:
    - 'ip'
  max_retries: 3
  find_time: '2 minutes'
  ban_time: '5 minutes'

storage:
  # encryption_key: REMOVED and handled by the environment variable AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
  local:
    path: '/config/db.sqlite3'

notifier:
  filesystem:
    filename: '/config/notification.txt'