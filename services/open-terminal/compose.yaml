services:
  open-terminal:
    build:
      context: ./
      dockerfile: open-terminal.Dockerfile
    container_name: open-terminal
    networks:
      - backend
    volumes:
      - open-terminal:/home/user
    healthcheck:
      test: ["CMD", "curl", "-f", "localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  open-terminal:
    name: open-terminal